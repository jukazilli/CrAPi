name: Configure Supabase Auth + Resend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/resend-auth-trigger.txt'

permissions:
  contents: read

concurrency:
  group: crapi-supabase-auth-resend
  cancel-in-progress: false

jobs:
  configure:
    name: Apply Auth email configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SOBERANIA_AUTH_FROM: no-reply@soberania.tech
      SUPABASE_PROJECT_REF: nxwqlxrdgpepscwjprym

    steps:
      - name: Validate required secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            throw 'GitHub secret SUPABASE_ACCESS_TOKEN is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RESEND_API_KEY)) {
            throw 'GitHub secret RESEND_API_KEY is missing.'
          }
          Write-Host 'Required secrets are present.'

      - name: Checkout reviewed Auth configuration
        uses: actions/checkout@v4
        with:
          ref: 8f1603ef027b5596aa86711774e8a090fa0336a5
          persist-credentials: false

      - name: Apply Resend SMTP and Auth templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/supabase/configure-auth-resend.ps1 -ProjectRef $env:SUPABASE_PROJECT_REF

      - name: Apply Auth e-mail rate limit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN"
            'Content-Type' = 'application/json'
            Accept = 'application/json'
          }
          $uri = "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/config/auth"
          $body = @{ rate_limit_email_sent = 30 } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -Body $body | Out-Null
          Write-Host 'Auth e-mail rate limit set to 30 messages/hour.'

      - name: Verify safe Supabase Auth settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN"
            Accept = 'application/json'
          }
          $uri = "https://api.supabase.com/v1/projects/$env:SUPABASE_PROJECT_REF/config/auth"
          $config = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers

          $checks = @(
            @{ Name = 'external_email_enabled'; Actual = $config.external_email_enabled; Expected = $true },
            @{ Name = 'mailer_autoconfirm'; Actual = $config.mailer_autoconfirm; Expected = $false },
            @{ Name = 'smtp_admin_email'; Actual = $config.smtp_admin_email; Expected = 'no-reply@soberania.tech' },
            @{ Name = 'smtp_host'; Actual = $config.smtp_host; Expected = 'smtp.resend.com' },
            @{ Name = 'smtp_port'; Actual = [int]$config.smtp_port; Expected = 465 },
            @{ Name = 'smtp_user'; Actual = $config.smtp_user; Expected = 'resend' },
            @{ Name = 'smtp_sender_name'; Actual = $config.smtp_sender_name; Expected = 'CrAPi | Soberania Tech' },
            @{ Name = 'rate_limit_email_sent'; Actual = [int]$config.rate_limit_email_sent; Expected = 30 },
            @{ Name = 'confirmation_subject'; Actual = $config.mailer_subjects_confirmation; Expected = 'Confirme seu e-mail | CrAPi' },
            @{ Name = 'recovery_subject'; Actual = $config.mailer_subjects_recovery; Expected = 'Redefina sua senha | CrAPi' }
          )

          foreach ($check in $checks) {
            if ($check.Actual -ne $check.Expected) {
              throw "Verification failed for $($check.Name)."
            }
            Write-Host "OK: $($check.Name)"
          }

          Write-Host 'Supabase Auth + Resend configuration verified without exposing secrets.'

      - name: Verify Resend SMTP transport
        shell: python
        run: |
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          msg = EmailMessage()
          msg['Subject'] = 'CrAPi SMTP verification'
          msg['From'] = 'CrAPi | Soberania Tech <no-reply@soberania.tech>'
          msg['To'] = 'delivered@resend.dev'
          msg.set_content('CrAPi cloud SMTP verification through Resend.')

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.resend.com', 465, context=context, timeout=20) as smtp:
              smtp.login('resend', os.environ['RESEND_API_KEY'])
              smtp.send_message(msg)

          print('Resend SMTP authentication, TLS and sender verification succeeded.')

      - name: Publish safe summary
        if: ${{ success() }}
        shell: pwsh
        run: |
          @'
          ## CrAPi Auth e-mail configuration

          ✅ Supabase Auth configured to use Resend SMTP.

          - Project: `cr-api`
          - Sender: `CrAPi | Soberania Tech <no-reply@soberania.tech>`
          - SMTP host: `smtp.resend.com:465`
          - Auth email rate limit: `30/hour`
          - E-mail confirmation: enabled
          - Auto-confirm: disabled
          - Auth templates: applied
          - SMTP transport test: passed
          - Secrets: not printed

          Next: run a real signup from staging and confirm the Auth e-mail flow.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
