name: Format Auth Gateway Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/format-auth-gateway-trigger.txt'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: foundation/m0-supabase
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format gateway
        run: pnpm exec prettier --write apps/worker/src/auth-gateway.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/worker/src/auth-gateway.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/auth-gateway.ts
          git commit -m "style(auth): format auth gateway"
          git push origin HEAD:foundation/m0-supabase
