name: Temporary auth formatter

on:
  push:
    branches:
      - 'foundation/m0-supabase'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/m0-supabase

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format auth implementation
        run: pnpm exec prettier --write apps/worker/src/auth-service.ts apps/worker/src/index.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/auth-service.ts apps/worker/src/index.ts
          git commit -m 'style(auth): normalize auth implementation'
          git push origin HEAD:foundation/m0-supabase
