name: Bootstrap foundation

on:
  push:
    branches:
      - 'foundation/**'
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Quality gates
        run: pnpm check:ci

      - name: Security gates
        run: pnpm security

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
