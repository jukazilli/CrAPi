name: Bootstrap foundation

on:
  push:
    branches:
      - 'foundation/**'
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Persist initial lockfile
        id: lockfile
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add generated pnpm lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Quality gates
        if: steps.lockfile.outputs.committed != 'true'
        run: pnpm check:ci

      - name: Security gates
        if: steps.lockfile.outputs.committed != 'true'
        run: pnpm security
