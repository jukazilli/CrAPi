name: Bootstrap foundation

on:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: corepack enable
      - run: corepack prepare pnpm@9.11.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm security
