name: Quality gates and staging deploy

on:
  push:
    branches:
      - 'foundation/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: pnpm check:ci

      - name: Security gates
        run: pnpm security

  deploy-staging:
    name: Deploy crapi-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/foundation/m0-supabase'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: crapi-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployment dependencies
        run: pnpm build

      - name: Validate staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SECRET_KEY API_KEY_PEPPER ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy Worker and runtime secrets
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/crapi-staging.secrets"
          output_file="$RUNNER_TEMP/wrangler-output.log"
          umask 077
          {
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
            printf 'API_KEY_PEPPER=%s\n' "$API_KEY_PEPPER"
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
          } > "$secrets_file"
          trap 'rm -f "$secrets_file" "$output_file"' EXIT

          pnpm dlx wrangler@4.127.1 deploy \
            --config apps/worker/wrangler.jsonc \
            --secrets-file "$secrets_file" 2>&1 | tee "$output_file"

          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$output_file" | tail -n 1 || true)"
          if [ -z "$deployment_url" ]; then
            echo '::error::Wrangler did not return a workers.dev deployment URL.'
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test hosted staging
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          curl_flags=(--silent --show-error --fail --retry 5 --retry-delay 1 --retry-all-errors)

          curl "${curl_flags[@]}" "$DEPLOYMENT_URL/health" >/dev/null
          curl "${curl_flags[@]}" "$DEPLOYMENT_URL/ready" >/dev/null
          curl "${curl_flags[@]}" "$DEPLOYMENT_URL/admin" >/dev/null

          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/admin/api/applications")"
          if [ "$unauthorized_status" != '401' ]; then
            echo "::error::Admin API without token returned HTTP $unauthorized_status instead of 401."
            exit 1
          fi

          applications_file="$RUNNER_TEMP/crapi-applications.json"
          trap 'rm -f "$applications_file"' EXIT
          curl "${curl_flags[@]}" \
            -H "x-crapi-admin-token: $ADMIN_TOKEN" \
            "$DEPLOYMENT_URL/admin/api/applications" > "$applications_file"

          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!Array.isArray(body.applications)) process.exit(1);" "$applications_file"

      - name: Publish staging URL
        run: |
          echo "### CrAPi staging" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted smoke tests: passed" >> "$GITHUB_STEP_SUMMARY"
