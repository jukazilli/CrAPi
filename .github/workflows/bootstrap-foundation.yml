name: Quality gates and staging deploy

on:
  push:
    branches:
      - 'foundation/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: pnpm check:ci

      - name: Security gates
        run: pnpm security

  deploy-staging:
    name: Deploy crapi-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/foundation/m0-supabase'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: crapi-staging
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.11.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployment dependencies
        run: pnpm build

      - name: Validate staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SECRET_KEY API_KEY_PEPPER ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy Worker and runtime secrets
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/crapi-staging.secrets"
          output_file="$RUNNER_TEMP/wrangler-output.log"
          umask 077
          {
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
            printf 'API_KEY_PEPPER=%s\n' "$API_KEY_PEPPER"
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
          } > "$secrets_file"
          trap 'rm -f "$secrets_file" "$output_file"' EXIT

          pnpm dlx wrangler@4.127.1 deploy \
            --config apps/worker/wrangler.jsonc \
            --secrets-file "$secrets_file" 2>&1 | tee "$output_file"

          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$output_file" | tail -n 1 || true)"
          if [ -z "$deployment_url" ]; then
            echo '::error::Wrangler did not return a workers.dev deployment URL.'
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test hosted staging
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          sleep 15

          assert_http() {
            local path="$1"
            local expected="$2"
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 10 --retry-delay 2 --retry-all-errors "$DEPLOYMENT_URL$path")"
            echo "$path -> HTTP $status"
            if [ "$status" != "$expected" ]; then
              echo "::error::$path returned HTTP $status instead of $expected."
              exit 1
            fi
          }

          assert_http '/health' '200'
          assert_http '/ready' '200'
          assert_http '/login' '200'
          assert_http '/criar-conta' '200'
          assert_http '/recuperar-senha' '200'
          assert_http '/admin' '303'
          assert_http '/admin/api/applications' '401'

      - name: Publish staging URL
        run: |
          echo "### CrAPi staging" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosted auth/control-plane smoke tests: passed" >> "$GITHUB_STEP_SUMMARY"
