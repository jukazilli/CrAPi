name: Diagnose Supabase Secret Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/diagnose-supabase-secret-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PROJECT_REF: nxwqlxrdgpepscwjprym
    steps:
      - name: Compare configured Worker secret with active project keys
        shell: node {0}
        run: |
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          const configured = process.env.SUPABASE_SECRET_KEY;
          const ref = process.env.SUPABASE_PROJECT_REF;
          if (!accessToken || !configured || !ref) throw new Error('Required diagnostic secrets are missing.');

          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${accessToken}`, Accept: 'application/json' },
          });
          if (!response.ok) throw new Error(`Management API returned HTTP ${response.status}.`);
          const body = await response.json();
          const keys = Array.isArray(body) ? body : Array.isArray(body?.data) ? body.data : [];

          const sensitiveNames = new Set(['api_key', 'key', 'secret', 'value', 'token']);
          function containsConfigured(value) {
            if (typeof value === 'string') return value === configured;
            if (Array.isArray(value)) return value.some(containsConfigured);
            if (value && typeof value === 'object') return Object.values(value).some(containsConfigured);
            return false;
          }

          console.log(`project_key_count=${keys.length}`);
          let matched = false;
          for (const item of keys) {
            const isMatch = containsConfigured(item);
            if (isMatch) matched = true;
            const safe = {};
            for (const [name, value] of Object.entries(item ?? {})) {
              if (sensitiveNames.has(name.toLowerCase())) continue;
              if (typeof value === 'string' && value === configured) continue;
              if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean' || value === null) {
                safe[name] = value;
              }
            }
            console.log(JSON.stringify({ match: isMatch, ...safe }));
          }
          console.log(`configured_worker_secret_matches_project_key=${matched}`);
          if (!matched) process.exit(2);
